<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search for books and create your personal reading list."
    />
    <title>Book Explorer</title>
  </head>

  <body>
    <header class="site-header">
      <div class="header-content">
        <h1>Book Explorer</h1>

        <nav>
          <a href="/">Home</a>
          <a href="#" id="reading-list-link">
  My Reading List (<span id="reading-list-count">0</span>)
</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <h2>Discover Your Next Book</h2>

        <p>
          Search by title, author, or subject and save books you want to read.
        </p>

        <form id="search-form">
  <select id="search-type">
    <option value="all">All</option>
    <option value="title">Title</option>
    <option value="author">Author</option>
    <option value="subject">Subject</option>
  </select>

  <input
    type="search"
    id="search-input"
    placeholder="Search for a book..."
    required
  />

  <button type="submit">Search</button>
</form>
      </section>

      <section class="results-section">
        <h2>Books</h2>
        <p id="results-info"></p>

        <div id="book-results" class="book-grid">
          <p>Search for a book to get started.</p>
        </div>
      </section>
      <section id="book-details-section" class="book-details-section hidden">
  <button id="close-details" type="button">Back to Results</button>

  <div id="book-details"></div>
</section>
<section id="reading-list-section" class="reading-list-section hidden">
  <div class="reading-list-header">
    <h2>My Reading List</h2>

    <button id="close-reading-list" type="button">
      Back to Search
    </button>
  </div>

  <div id="reading-list" class="book-grid">
    <p>Your reading list is empty.</p>
  </div>
</section>
    </main>

    <footer>
      <p>&copy; 2026 Book Explorer | WDD 330 Final Project</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
